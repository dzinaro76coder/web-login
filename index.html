<!doctype html>
<html lang="en">
  <head>
    <title>Web Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <nav class="nav">
        <a href="#" class="nav_logo"> Dzinaro76 Coding lab </a>
        <ul class="nav_items">
          <li class="nav_item">
            <a href="#"> Home </a>
            <a href="#"> Products </a>
            <a href="#"> Services </a>
            <a href="#"> Contact </a>
          </li>
        </ul>
        <button class="button" id="form-open">Login</button>
      </nav>
    </header>

    <!--Home-->
    <section class="home">
      <div class="form_container">
        <i class="bx bx-x"> </i>
        <!--Login form-->
        <div class="form login_form">
          <div action="#">
            <h2>Login</h2>
            <div class="input_box">
              <input type="email" placeholder="Enter your email" required />
              <i class="bx bx-envelope"></i>
            </div>
            <div class="input_box">
              <input
                type="password"
                placeholder="Enter your password"
                required
              />
              <i class="bx bx-lock password"></i>
              <i class="bx bx-eye-slash pw_hide"></i>
            </div>
            <div class="option_field">
              <span class="checkbox">
                <input
                  type="checkbox"
                  name="checkbox"
                  value="checked"
                  id="check"
                />
                <label for="check"> Remember Me </label>
                <a href="#" class="forgot_pw"> Forgot Password? </a>
              </span>
            </div>
            <button class="button">Login Now</button>
            <div class="login_signup">
              Don't have an account? <a href="#" id="signup"> Sign Up </a>
            </div>
          </div>
        </div>

        <!--Signup form-->
        <div class="form signup_form">
          <div action="#">
            <h2>SignUp</h2>
            <div class="input_box">
              <input type="email" placeholder="Enter your email" required />
              <i class="bx bx-envelope"></i>
            </div>
            <div class="input_box">
              <input type="password" placeholder="Create a password" required />
              <i class="bx bx-lock password"></i>
              <i class="bx bx-eye-slash pw_hide"></i>
            </div>
            <div class="input_box">
              <input type="password" placeholder="Confirm password" required />
              <i class="bx bx-lock password"></i>
              <i class="bx bx-eye-slash pw_hide"></i>
            </div>

            <button class="button">SignUp Now</button>
            <div class="login_signup">
              Already have an account? <a href="#" id="login"> Login </a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="javascript/script.js"></script>
  </body>
</html>
